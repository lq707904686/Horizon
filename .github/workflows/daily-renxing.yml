name: 人性台账·爆款选题雷达

on:
  schedule:
    # GitHub 定时任务用 UTC 时间。23:00 UTC = 北京时间 07:00，每天早上跑。
    - cron: '0 23 * * *'
  workflow_dispatch:      # 允许手动触发（Actions 页面点 Run workflow）

jobs:
  daily-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: renxing-daily
      cancel-in-progress: false
    # 北京时间归档：不设 TZ 则用 UTC 日期，早上 7:10（UTC 23:10）的运行会把简报写到前一天路径并覆盖前一天内容（2026-11-09 已撞过一次）。TZ 只修 date 命令与 hotspots.json 的日期；Horizon 内部用 UTC 定文件名与 front-matter 日期（2026-11-12 实测：TZ 已生效但简报仍写进 11-11），所以下面另有重命名步骤根治。
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write  # 需要提交 hotspots.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: 使用人性台账雷达配置
        run: cp data/config.renxing.json data/config.json

      - name: 抓取热榜（百度/头条/今日热榜5节点）
        run: python tools/fetch_hotlists.py --out-dir data/hotlists

      - name: 本地 serving 热榜 RSS
        run: |
          nohup python3 -m http.server 8123 --directory data/hotlists >/tmp/hotlists-server.log 2>&1 &
          sleep 2
          curl -fsS -o /dev/null -w "baidu.xml: %{http_code}\n" http://127.0.0.1:8123/baidu.xml
          curl -fsS -o /dev/null -w "toutiao.xml: %{http_code}\n" http://127.0.0.1:8123/toutiao.xml
          for f in weixin weibo douyin bilibili zhihu; do curl -fsS -o /dev/null -w "$f.xml: %{http_code}\n" http://127.0.0.1:8123/$f.xml; done
          # BUG-1 根治：上面任一源 404/500 即失败退出；再验 7 个文件本地均非空
          for f in baidu toutiao weixin weibo douyin bilibili zhihu; do test -s "data/hotlists/$f.xml" || { echo "热榜文件缺失或为空: $f.xml"; exit 1; }; done

      - name: 加载历史反馈加权（v1.8 反馈闭环）
        run: python tools/load_feedback.py --window 14 --log data/feedback_log.jsonl --prompt profiles/renxing/analysis.md

      - name: 运行爆款雷达
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run horizon --hours 24

      - name: 按北京时间重命名简报（Horizon 文件名用 UTC）
        # Horizon 内部用 UTC 定文件名与 front-matter 日期，TZ 环境变量改不了它；
        # 07:00 北京时间运行时会写到前一天路径并覆盖前一天简报（2026-11-09/10/11/12
        # 连撞四次）。这里把 Horizon 刚写的文件（文件名 + front-matter 里的 title/date
        # 两行）改到北京时间日期。只改 front-matter（第 2 行到下一个 ---），正文里的
        # 日期不动；UTC 日期与北京时间同一天时不做任何事。
        run: |
          UTC_DATE=$(TZ=UTC date +'%Y-%m-%d')
          BJ_DATE=$(date +'%Y-%m-%d')
          if [ "$UTC_DATE" != "$BJ_DATE" ]; then
            for f in docs/_posts/${UTC_DATE}-summary-*.md; do
              [ -e "$f" ] || continue
              sed -i "2,/^---$/s/${UTC_DATE}/${BJ_DATE}/g" "$f"
              mv "$f" "${f/${UTC_DATE}/${BJ_DATE}}"
            done
          fi
          ls docs/_posts/ | tail -3

      - name: 生成 hotspots.json（喂给公众号流程）
        run: python tools/make_hotspots.py --summaries data/summaries --out hotspots.json

      - name: 提交 hotspots.json
        run: |
          git config user.name "renxing-radar"
          git config user.email "renxing-radar@users.noreply.github.com"
          git add hotspots.json
          git diff --cached --quiet || git commit -m "🎯 每日爆款选题 $(date +'%Y-%m-%d')"
          git push

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: 发布每日简报到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 每日选题雷达: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      - name: 失败时写 job summary 通知
        if: failure()
        run: |
          {
            echo "## 雷达运行失败"
            echo ""
            echo "时间：$(date +'%Y-%m-%d %H:%M %Z')"
            echo "请到 Actions 页面查看 daily-renxing.yml 本次运行的失败步骤。"
          } >> "$GITHUB_STEP_SUMMARY"
