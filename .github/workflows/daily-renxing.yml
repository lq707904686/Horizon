name: 人性台账·爆款选题雷达

on:
  schedule:
    # GitHub 定时任务用 UTC 时间。23:00 UTC = 北京时间 07:00，每天早上跑。
    - cron: '0 23 * * *'
  workflow_dispatch:      # 允许手动触发（Actions 页面点 Run workflow）

jobs:
  daily-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要提交 hotspots.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: 使用人性台账雷达配置
        run: cp data/config.renxing.json data/config.json

      - name: 抓取热榜（百度热搜/头条热榜）
        run: python tools/fetch_hotlists.py --out-dir data/hotlists

      - name: 本地 serving 热榜 RSS
        run: |
          nohup python3 -m http.server 8123 --directory data/hotlists >/tmp/hotlists-server.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "baidu.xml: %{http_code}\n" http://127.0.0.1:8123/baidu.xml
          curl -s -o /dev/null -w "toutiao.xml: %{http_code}\n" http://127.0.0.1:8123/toutiao.xml

      - name: 运行爆款雷达
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run horizon --hours 24

      - name: 生成 hotspots.json（喂给公众号流程）
        run: python tools/make_hotspots.py --summaries data/summaries --out hotspots.json

      - name: 提交 hotspots.json
        run: |
          git config user.name "renxing-radar"
          git config user.email "renxing-radar@users.noreply.github.com"
          git add hotspots.json
          git diff --cached --quiet || git commit -m "🎯 每日爆款选题 $(date +'%Y-%m-%d')"
          git push

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: 发布每日简报到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 每日选题雷达: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
